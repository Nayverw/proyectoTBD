<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassCloud - Inicio</title>
  <link rel="stylesheet" href="../css/styles_inicio.css" />
  <style>
    .center-block {
      max-width: 100%;
      width: 100% !important;
      overflow-x: hidden;
      box-sizing: border-box;
    }

    html,
    body {
      overflow-x: hidden !important;
    }

    /* Oculta el botón de Bitácora por defecto */
    #btn-bitacora {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    
    <!-- BLOQUE IZQUIERDO -->
    <div class="left-block">
      <div class="left-content">
        <h1 class="logo">ClassCloud</h1>
        <div class="menu-box">
          <button class="menu-btn" id="btn-cursos">Cursos</button>
          <button class="menu-btn" id="btn-docentes">Docentes</button>
          <button class="menu-btn" id="btn-recompensas">Recompensas</button>
          <button class="menu-btn" id="btn-insignias">Insignias</button>
          <button class="menu-btn" id="btn-pagos">Pagos</button>
          <button class="menu-btn" id="btn-oferta">Oferta</button>
          <button class="menu-btn" id="btn-seminarios">Seminarios</button>
          <button class="menu-btn" id="btn-foros">Foros</button>

          <!-- BOTÓN DE BITÁCORA (solo para ADMIN) -->
          <button class="menu-btn" id="btn-bitacora">Bitácora</button>

          <button class="menu-btn" id="btn-cerrar">Cerrar Sesión</button>
        </div>
      </div>
    </div>

    <!-- BLOQUE CENTRAL -->
    <div class="center-block">

      <!-- Barra de búsqueda -->
      <div class="search-welcome">
    
        <div class="search-bar">
            <input type="text" placeholder="Buscar..." />
            <button>🔍</button>
        </div>

        <h2 id="bienvenida-usuario" class="bienvenida-text"></h2>

      </div>

      <!-- BLOQUE BLANCO CENTRAL -->
      <div id="main-box" class="main-box">
        <div id="contenido-central" class="bienvenida-container">
          <div class="bienvenida-left">
            <h2 id="bienvenida-usuario">Bienvenido, Usuario</h2>
          </div>
          <div class="bienvenida-right">
            <p>Explora tus cursos y comienza a aprender hoy mismo.</p>
          </div>
        </div>
      </div>
    </div>

    <!-- BLOQUE DERECHO -->
    <div class="right-block">
      <div class="icons-container">
        <div class="icon-square"></div>
        <div class="icon-square"></div>
        <div class="icon-square"></div>
      </div>

      <div class="rewards-block">
        <h2 class="rewards-title">Recompensas y puntos</h2>
        <div class="large-square"></div>
        <button class="menu-btn" id="btn-canjear">Canjear Recompensas</button>
        <button class="menu-btn" id="btn-gestionpuntos">Gestión de Puntos</button>
      </div>

      <div class="actions-block">
        <button class="menu-button" id="btn-logros">Logros</button>
        <button class="menu-button" id="btn-ranking">Ranking</button>
        <button class="menu-button" id="btn-almacen">Almacén</button>
      </div>
    </div>
    
  </div>

  <!-- jsPDF y html2canvas desde CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- jsPDF AutoTable plugin -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
  <!-- Script principal con lógica modular -->
  <script type="module" src="../scripts/cargarHome.js"></script>

<script>
document.addEventListener("DOMContentLoaded", () => {

    const nombre = sessionStorage.getItem("nombre_usuario") || "Usuario";
    const rol = sessionStorage.getItem("rol_usuario") || "";

    let saludo = "Bienvenido";

    if (rol === "ESTUDIANTE") saludo = "Bienvenido Estudiante";
    if (rol === "DOCENTE") saludo = "Bienvenido Docente";
    if (rol === "ADMINISTRADOR") saludo = "Bienvenido Administrador";

    const elemento = document.getElementById("bienvenida-usuario");
    if (elemento) {
        elemento.textContent = `${saludo}, ${nombre}`;
    }

    // 🔹 Mostrar botón Bitácora solo si el rol es Administrador
    const botonBitacora = document.getElementById("btn-bitacora");
    if (rol === "ADMINISTRADOR" && botonBitacora) {
        botonBitacora.style.display = "block";
    }
});
</script>

</body>
</html>
