<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ClassCloud - Inicio</title>
  <link rel="stylesheet" href="../css/styles_inicio.css" />
</head>
<body>
  <div class="container">
    <!-- BLOQUE IZQUIERDO -->
    <div class="left-block">
      <div class="left-content">
        <h1 class="logo">ClassCloud</h1>
        <div class="menu-box">
          <button class="menu-btn">Cursos</button>
          <button class="menu-btn">Docentes</button>
          <button class="menu-btn">Recompensas</button>
          <button class="menu-btn">Insignias</button>
          <button class="menu-btn">Pagos</button>
          <button class="menu-btn">Oferta</button>
        </div>
      </div>
    </div>

    <!-- BLOQUE CENTRAL -->
    <div class="center-block">
      <div class="search-bar">
        <input type="text" placeholder="Buscar..." />
        <button>🔍</button>
      </div>
      <div class="main-box"></div>
    </div>

    <!-- BLOQUE DERECHO -->
    <div class="right-block">
      <div class="icons-container">
        <div class="icon-square"></div>
        <div class="icon-square"></div>
        <div class="icon-square"></div>
      </div>

      <!-- Bloque superior -->
      <div class="rewards-block">
        <h2 class="rewards-title">Recompensas y puntos</h2>
        <div class="large-square"></div>
        <button class="small-button">Canjear recompensas</button>
      </div>

      <!-- Bloque inferior -->
      <div class="actions-block">
        <button class="menu-button">Logros</button>
        <button class="menu-button">Ranking</button>
        <button class="menu-button">Almacén</button>
      </div>
    </div>
  </div>
  <script src="../scripts/cargarHome.js"></script>
</body>
</html>
